name: Test PowerShell

on:
    push:
        branches: [main]
        paths-ignore: ['*.md', 'Docs/**', 'Examples/**', '.gitignore']
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    package:
        name: Build unsigned package
        runs-on: windows-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: |
                      8.x
                      10.x
            - name: Install shared builder
              shell: pwsh
              run: Install-Module PSPublishModule -MinimumVersion 3.0.151 -Force -Scope CurrentUser -AllowClobber
            - name: Build through native module entrypoint
              shell: pwsh
              run: |
                  $version = (Import-PowerShellDataFile ./Module/DnsClientX.psd1).ModuleVersion
                  ./Module/Build/Build-Module.ps1 -RunMode Build -SignModule:$false -UpdateVersions:$false -ModuleVersion $version -SkipInstall
            - name: Upload module and NuGet candidates
              uses: actions/upload-artifact@v7
              with:
                  name: unsigned-packages
                  path: |
                      Artefacts/Packed/*.zip
                      Artefacts/ProjectBuild/packages/*.nupkg
                  if-no-files-found: error

    test:
        needs: package
        name: ${{ matrix.name }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { name: Windows PowerShell 5.1 package, os: windows-latest, shell: powershell }
                    - { name: Windows PowerShell 7 package, os: windows-latest, shell: pwsh }
                    - { name: Linux PowerShell 7 package, os: ubuntu-latest, shell: pwsh }
                    - { name: macOS PowerShell 7 package, os: macos-latest, shell: pwsh }
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: actions/download-artifact@v8
              with:
                  name: unsigned-packages
                  path: candidate
            - name: Install Pester
              shell: pwsh
              run: |
                  $install = {
                      [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
                      Install-Module Pester -MinimumVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck -AllowClobber -ErrorAction Stop
                  }
                  if ('${{ matrix.shell }}' -eq 'powershell') {
                      & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command $install
                      if ($LASTEXITCODE) { throw 'Windows PowerShell Pester installation failed.' }
                  } else {
                      & $install
                  }
            - name: Import packaged module and run contracts
              shell: pwsh
              run: |
                  $archive = @(Get-ChildItem candidate/Packed -Filter 'DnsClientX-PowerShellModule.*.zip')
                  if ($archive.Count -ne 1) { throw 'Expected one module archive.' }
                  $root = Join-Path $env:RUNNER_TEMP 'module-candidate'
                  Expand-Archive -LiteralPath $archive[0].FullName -DestinationPath $root
                  $manifest = @(Get-ChildItem $root -Filter DnsClientX.psd1 -Recurse)
                  if ($manifest.Count -ne 1) { throw 'Expected one packaged module manifest.' }
                  if ('${{ matrix.shell }}' -eq 'powershell') {
                      & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./Build/Test-PackagedModule.ps1 -ModulePath $manifest[0].FullName -ResultsPath "$env:RUNNER_TEMP/pester.xml"
                      if ($LASTEXITCODE) { throw 'Windows PowerShell package validation failed.' }
                  } else {
                      ./Build/Test-PackagedModule.ps1 -ModulePath $manifest[0].FullName -ResultsPath "$env:RUNNER_TEMP/pester.xml"
                  }
            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: pester-${{ matrix.os }}-${{ matrix.shell }}
                  path: ${{ runner.temp }}/pester.xml

    test-minimum:
        needs: package
        name: Minimum PowerShell 7.4.0 package
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: actions/download-artifact@v8
              with:
                  name: unsigned-packages
                  path: candidate
            - name: Install isolated minimum supported host
              shell: pwsh
              run: |
                  $root = Join-Path $env:RUNNER_TEMP 'powershell-7.4.0'
                  New-Item -ItemType Directory -Path $root | Out-Null
                  $archive = Join-Path $env:RUNNER_TEMP 'powershell-7.4.0.tar.gz'
                  Invoke-WebRequest https://github.com/PowerShell/PowerShell/releases/download/v7.4.0/powershell-7.4.0-linux-x64.tar.gz -OutFile $archive
                  if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'AA82C3E9241503B52DB1827E3FD7FC099DA74F828BA032E9B726E50C72B4BEE5') { throw 'PowerShell download hash mismatch.' }
                  tar -xzf $archive -C $root
                  if ($LASTEXITCODE) { throw 'PowerShell extraction failed.' }
                  chmod +x "$root/pwsh"
                  if ($LASTEXITCODE) { throw 'PowerShell executable setup failed.' }
                  Install-Module Pester -MinimumVersion 5.7.1 -Force -Scope CurrentUser -AllowClobber
            - name: Import package on minimum host and run contracts
              shell: pwsh
              run: |
                  $archive = @(Get-ChildItem candidate/Packed -Filter 'DnsClientX-PowerShellModule.*.zip')
                  if ($archive.Count -ne 1) { throw 'Expected one module archive.' }
                  $root = Join-Path $env:RUNNER_TEMP 'module-candidate'
                  Expand-Archive -LiteralPath $archive[0].FullName -DestinationPath $root
                  $manifest = @(Get-ChildItem $root -Filter DnsClientX.psd1 -Recurse)
                  if ($manifest.Count -ne 1) { throw 'Expected one packaged module manifest.' }
                  & "$env:RUNNER_TEMP/powershell-7.4.0/pwsh" -NoProfile -File ./Build/Test-PackagedModule.ps1 -ModulePath $manifest[0].FullName -ResultsPath "$env:RUNNER_TEMP/pester.xml"
                  if ($LASTEXITCODE) { throw 'Minimum PowerShell contract validation failed.' }
            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: pester-powershell-7.4.0
                  path: ${{ runner.temp }}/pester.xml

    package-consumer:
        needs: package
        name: Packed NuGet consumer (${{ matrix.os }})
        strategy:
            fail-fast: false
            matrix:
                os: [windows-latest, ubuntu-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: actions/download-artifact@v8
              with:
                  name: unsigned-packages
                  path: candidate
            - uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: |
                      8.x
                      10.x
            - name: Consume private candidates with isolated restore
              shell: pwsh
              run: |
                  $feed = (Resolve-Path candidate/ProjectBuild/packages).Path
                  $core = @(Get-ChildItem $feed -Filter 'DnsClientX.*.nupkg' | Where-Object Name -Match '^DnsClientX\.\d')
                  $provider = @(Get-ChildItem $feed -Filter 'DnsClientX.DnsSec.EdDsa.*.nupkg')
                  if ($core.Count -ne 1 -or $provider.Count -ne 1) { throw 'Expected core and optional provider candidates.' }
                  $version = $core[0].BaseName.Substring('DnsClientX.'.Length)
                  $providerVersion = $provider[0].BaseName.Substring('DnsClientX.DnsSec.EdDsa.'.Length)
                  $env:NUGET_PACKAGES = Join-Path $env:RUNNER_TEMP 'candidate-nuget-cache'
                  $env:DNSCLIENTX_CANDIDATE_FEED = $feed
                  dotnet restore Build/PackageConsumer/PackageConsumer.csproj --configfile Build/PackageConsumer/NuGet.Config -p:DnsClientXPackageVersion=$version -p:DnsClientXEdDsaPackageVersion=$providerVersion
                  if ($LASTEXITCODE) { throw 'Packed consumer restore failed.' }
                  foreach ($framework in @('net8.0', 'net10.0')) {
                      dotnet run --project Build/PackageConsumer/PackageConsumer.csproj --framework $framework --no-restore -p:DnsClientXPackageVersion=$version -p:DnsClientXEdDsaPackageVersion=$providerVersion
                      if ($LASTEXITCODE) { throw "Packed consumer failed on $framework." }
                  }
