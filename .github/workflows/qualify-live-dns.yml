name: Qualify live DNS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qualify-live-dns.yml'
      - 'scripts/qualification/**'

permissions:
  contents: read

jobs:
  native:
    name: Live DNS (${{ matrix.os }}, ${{ matrix.framework }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        framework: [net8.0, net10.0]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.x
            10.x
      - name: Install Linux QUIC platform runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes libmsquic
          dpkg-query -W libmsquic
      - name: Build qualification runner
        run: dotnet build scripts/qualification/Qualification.csproj -c Release -p:TargetFrameworks=${{ matrix.framework }}
      - name: Capture native live DNS contracts
        shell: pwsh
        run: |
          $null = New-Item -ItemType Directory -Path artifacts/live-dns -Force
          dotnet scripts/qualification/bin/Release/${{ matrix.framework }}/Qualification.dll 2> artifacts/live-dns/live.stderr | Set-Content -LiteralPath artifacts/live-dns/live-result.json -Encoding UTF8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise and clean native NRPT routing
        if: always() && runner.os == 'Windows'
        shell: powershell
        run: ./scripts/qualification/Invoke-NrptQualification.ps1 -AssemblyPath scripts/qualification/bin/Release/${{ matrix.framework }}/Qualification.dll -OutputDirectory artifacts/live-dns/nrpt
      - name: Keep qualification diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-dns-${{ matrix.os }}-${{ matrix.framework }}
          path: artifacts/live-dns/
          retention-days: 7
          if-no-files-found: error
