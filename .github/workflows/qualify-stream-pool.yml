name: Qualify stream pool

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qualify-stream-pool.yml'

permissions:
  contents: read

jobs:
  windows:
    name: Windows stream pool (${{ matrix.framework }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        framework: [net472, net8.0, net10.0]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.x
            10.x
      - name: Build selected runtime
        run: dotnet build DnsClientX.Tests/DnsClientX.Tests.csproj -c Release -p:TargetFrameworks=${{ matrix.framework }}
      - name: Repeat cancellation and replacement contracts
        shell: pwsh
        run: |
          $filter = 'FullyQualifiedName~CancelledTransactionIdMovesToFreshConnection|FullyQualifiedName~ConcurrentRetryKeepsFreshReplacementConnection|FullyQualifiedName~CanceledBurstBoundsOutstandingQueriesOnEachConnection|FullyQualifiedName~QueuedWriteCancellationDoesNotFaultSharedConnection'
          for ($iteration = 1; $iteration -le 20; $iteration++) {
              Write-Host "Stream qualification iteration $iteration / 20 on ${{ matrix.framework }}"
              dotnet test DnsClientX.Tests/DnsClientX.Tests.csproj -c Release -f ${{ matrix.framework }} --no-build --filter $filter --logger trx --results-directory "qualification/${{ matrix.framework }}/$iteration" --blame-hang --blame-hang-timeout 60s --blame-hang-dump-type none
              if ($LASTEXITCODE -ne 0) {
                  exit $LASTEXITCODE
              }
          }
      - name: Keep native qualification diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stream-pool-${{ matrix.framework }}
          path: qualification/
          retention-days: 7
          if-no-files-found: error
