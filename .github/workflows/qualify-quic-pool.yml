name: Qualify native encrypted DNS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qualify-quic-pool.yml'
      - 'DnsClientX/ProtocolDnsQuic/DnsQuicConnectionPool.cs'
      - 'DnsClientX/ProtocolDnsQuic/DnsWireResolveQuic.cs'
      - 'DnsClientX/Network/DnsTlsCertificateTrust.cs'
      - 'DnsClientX/ProtocolDnsHttp3/**'
      - 'DnsClientX/ProtocolDnsWire/DnsWireResolve.cs'
      - 'DnsClientX/DnsHttp*.cs'
      - 'DnsClientX/DnsClientX.cs'
      - 'DnsClientX/DnsClientX.Http*.cs'
      - 'DnsClientX/DnsClientX.Resolve.cs'
      - 'DnsClientX/DnsClientX.Dispose.cs'
      - 'DnsClientX/Configuration*.cs'
      - 'DnsClientX/Definitions/DnsResolverEndpoint.cs'
      - 'DnsClientX/Network/DnsServerResolver.cs'
      - 'DnsClientX/Network/DnsBootstrapResolver.cs'
      - 'DnsClientX.Tests/DnsQuicConnectionPool*'
      - 'DnsClientX.Tests/NativeEncryptedDns*'
      - 'DnsClientX.Tests/TestUtilities.cs'
      - 'DnsClientX.Tests/DnsClientX.Tests.csproj'
  push:
    branches: [main]
    paths:
      - '.github/workflows/qualify-quic-pool.yml'
      - 'DnsClientX/ProtocolDnsQuic/DnsQuicConnectionPool.cs'
      - 'DnsClientX/ProtocolDnsQuic/DnsWireResolveQuic.cs'
      - 'DnsClientX/Network/DnsTlsCertificateTrust.cs'
      - 'DnsClientX/ProtocolDnsHttp3/**'
      - 'DnsClientX/ProtocolDnsWire/DnsWireResolve.cs'
      - 'DnsClientX/DnsHttp*.cs'
      - 'DnsClientX/DnsClientX.cs'
      - 'DnsClientX/DnsClientX.Http*.cs'
      - 'DnsClientX/DnsClientX.Resolve.cs'
      - 'DnsClientX/DnsClientX.Dispose.cs'
      - 'DnsClientX/Configuration*.cs'
      - 'DnsClientX/Definitions/DnsResolverEndpoint.cs'
      - 'DnsClientX/Network/DnsServerResolver.cs'
      - 'DnsClientX/Network/DnsBootstrapResolver.cs'
      - 'DnsClientX.Tests/DnsQuicConnectionPool*'
      - 'DnsClientX.Tests/NativeEncryptedDns*'
      - 'DnsClientX.Tests/TestUtilities.cs'
      - 'DnsClientX.Tests/DnsClientX.Tests.csproj'

permissions:
  contents: read

jobs:
  native:
    name: QUIC pool (${{ matrix.os }}, ${{ matrix.framework }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        framework: [net8.0, net10.0]
    env:
      DNSCLIENTX_REQUIRE_QUIC: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: EvotecIT/.github/actions/setup-dotnet@6a07f68bbcf97cfce479f930590d4fe4d85ef715
        with:
          dotnet-version: |
            8.x
            10.x
      - name: Install Linux QUIC platform runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes libmsquic
          dpkg-query -W libmsquic
      - name: Install macOS QUIC platform runtime
        if: runner.os == 'macOS'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install libmsquic openssl@3
          brew list --versions libmsquic openssl@3
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib:$(brew --prefix openssl@3)/lib" >> "$GITHUB_ENV"
      - name: Verify encrypted DNS with native loopback connections
        run: dotnet test DnsClientX.Tests/DnsClientX.Tests.csproj -c Release -f ${{ matrix.framework }} --filter "FullyQualifiedName~DnsQuicConnectionPool|FullyQualifiedName~NativeEncryptedDns" --logger trx --results-directory artifacts/quic-pool
      - name: Keep native qualification results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quic-pool-${{ matrix.os }}-${{ matrix.framework }}
          path: artifacts/quic-pool/
          retention-days: 7
          if-no-files-found: error
